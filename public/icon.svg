<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian space background with subtle radial core -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Holographic metallic shield ruby-to-crimson gradient -->
    <linearGradient id="shieldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Gold & molten edge trim -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <!-- Glowing inner guardian core -->
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fecdd3" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#e11d48" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Heavy drop shadow for 3D realism -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#e11d48" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Orbital radar rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="16 10"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 8"/>

  <!-- Outer Faceted Armor Shield Plate -->
  <path d="M256 50 L420 102 C420 260 345 390 256 455 C167 390 92 260 92 102 Z"
        fill="url(#shieldMetallic)" stroke="url(#goldRim)" stroke-width="10" stroke-linejoin="round" filter="url(#neonShadow)"/>

  <!-- Inner Chamfered Bezel Plate -->
  <path d="M256 82 L384 126 C384 250 324 355 256 412 C188 355 128 250 128 126 Z"
        fill="#090d16" stroke="#fda4af" stroke-width="4" stroke-opacity="0.65"/>

  <!-- Concentric Defense Radar Arcs -->
  <path d="M256 130 C306 130 345 170 345 230 C345 295 300 340 256 375 C212 340 167 295 167 230 C167 170 206 130 256 130 Z"
        fill="url(#coreGlow)" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 6" opacity="0.92"/>

  <!-- Central Cyber Guardian 8-Point Star Crest -->
  <g transform="translate(256, 230)">
    <polygon points="0,-72 16,-24 64,-24 28,8 44,56 0,28 -44,56 -28,8 -64,-24 -16,-24"
             fill="#ffffff" stroke="#fb7185" stroke-width="3"/>
    <!-- Center Luminous Diamond & Core Beacon -->
    <circle cx="0" cy="0" r="14" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Crown Arc -->
  <path d="M180 115 L256 70 L332 115" stroke="#fef08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower Cyan Energy Flares -->
  <path d="M180 330 L256 395 L332 330" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
