name: Kawach Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Code Quality, Automated Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Lint & Typecheck
        run: npm run lint

      - name: Run Python Automated Regression & Load Test Suite
        run: python3 her_safe.py --test

      - name: Build Production Frontend Bundle
        run: npm run build
